const p=new URLSearchParams(location.search),klasse=p.get("klasse")==="12"?"12":"11",bw=Math.max(1,Math.min(12,Number(p.get("bw"))||1)),st=Math.max(1,Math.min(4,Number(p.get("stunde"))||1));

{type:"mc",title:"Grundverständnis",q:"Welches Thema gehört zum Schwerpunkt „"+b[0]+"“?",opts:[b[1],"Wandgestaltung","Büroorganisation"],correct:0},
{type:"gap",title:"Lückentext",q:"Ergänze die Aussage zu „"+topic+"“: Ein wichtiger Fachbegriff ist …",opts:[b[2],"Schreibtisch","Tapetenrolle"],correct:0},

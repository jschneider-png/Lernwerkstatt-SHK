<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10477f"><title>Lernwerkstatt SHK · Responsive Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#e6f1f9}
.page{max-width:1024px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;box-shadow:0 0 25px #173a4d19}
.part{position:relative;width:100%;overflow:hidden;isolation:isolate}
.part img{display:block;position:absolute;width:100%;height:auto;max-width:none;left:0;pointer-events:none}
.hero{aspect-ratio:1024/600}.hero img{top:0}
.classes{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1024/610}
.classes .art{position:absolute;inset:0;overflow:hidden;z-index:-1}
.classes .art img{top:calc(-600 / 610 * 100%);width:100%;height:auto}
.tile{display:block;position:relative;z-index:2;outline-offset:-4px;border-radius:14px;-webkit-tap-highlight-color:rgba(255,255,255,.16)}
.tile:focus-visible{outline:4px solid #ffb300}
.tile.inactive{pointer-events:none}
.footer{aspect-ratio:1024/326;flex:1;min-height:0}
.footer img{bottom:0}
@media(max-width:700px){
.page{width:100%}
.hero{aspect-ratio:1024/600}
.classes{aspect-ratio:1024/610}
.footer{aspect-ratio:1024/326;flex:1}
}
@media(min-aspect-ratio:3/4) and (max-width:700px){
.page{min-height:100dvh}
.footer{flex:1}
}
</style></head><body>
<main class="page">
<section class="part hero" aria-label="Lernwerkstatt SHK – Fachbereich Metall"><img src="startseite-vorlage.png?v=20261029d" alt="Lernwerkstatt SHK"></section>
<section class="part classes" aria-label="Klassenräume">
<div class="art" aria-hidden="true"><img src="startseite-vorlage.png?v=20261029d" alt=""></div>
<div class="tile inactive" aria-label="Klasse 10, inaktiv"></div>
<a class="tile" href="klasse11.html" aria-label="Klasse 11 Sanitärtechnik öffnen"></a>
<a class="tile" href="klasse12/index.html" aria-label="Klasse 12 Heizungstechnik öffnen"></a>
<div class="tile inactive" aria-label="Klasse 13, inaktiv"></div>
</section>
<section class="part footer" aria-label="Aktuelle Informationen"><img src="startseite-vorlage.png?v=20261029d" alt="Aktuelle Informationen: Termine, Hinweise, Ansprechpartner"></section>
</main></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundenauftrag – Abgase & Emissionen</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f8;color:#183b50;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.top a{color:#23658b;text-decoration:none;font-weight:800}.pill{display:inline-block;background:#dbeaf3;border-radius:22px;padding:7px 12px;font-size:.84rem;font-weight:800}h1{font-size:clamp(1.4rem,3vw,2rem)}h2{font-size:clamp(1.5rem,4vw,2.4rem);margin:18px 0}p{font-size:clamp(1.05rem,2vw,1.25rem);line-height:1.7}.stage{background:white;border:1px solid #c9dce7;border-radius:20px;box-shadow:0 16px 38px #123e5a15;min-height:400px;margin:20px 0;padding:clamp(20px,5vw,45px)}.eq{border-left:5px solid #23658b;background:#e8f3fa;padding:18px;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:800;line-height:1.7;border-radius:10px}.task{background:#fff6e5;border-left:5px solid #eaa036;border-radius:10px;padding:18px;margin-top:20px}.task p{margin-bottom:8px}.task strong{color:#704e18}.answer{background:#e6f3ea;border-radius:9px;padding:13px;line-height:1.6;margin-top:12px}.answer[hidden]{display:none}.reveal,.nav button{font:800 1rem system-ui;border:0;border-radius:11px;padding:12px 18px;cursor:pointer;background:#23658b;color:white}.reveal{background:#d3e6ef;color:#174562}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}.nav button:disabled{opacity:.4;cursor:not-allowed}.dots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:16px 0}.dots button{border:0;border-radius:15px;background:#b4cad8;width:26px;height:10px;cursor:pointer}.dots button[aria-current="step"]{background:#23658b}
.limits{width:100%;border-collapse:collapse;margin:16px 0;font-size:1rem}.limits th,.limits td{border:1px solid #c6dce7;padding:10px;text-align:left;vertical-align:top}.limits th{background:#e6f2f8}.source{font-size:.92rem}ol li{font-size:1.1rem;line-height:1.6;margin:7px 0}a{color:#23658b}</style></head><body><main class="wrap"><div class="top"><a href="emissionen-abgase.html">← Zurück zum interaktiven Abgasbild</a><span class="pill">BW 2 · Stunde 4 · Präsentation ohne Timer</span></div><h1>Kundenauftrag: Abgase und Emissionen</h1><section class="stage" id="stage" aria-live="polite"></section><nav class="nav"><button type="button" id="prev">← Zurück</button><strong id="counter"></strong><button type="button" id="next">Weiter →</button></nav><div class="dots" id="dots"></div></main><script>
const slides=[["Kundenauftrag","<p>Der Kunde berichtet: <strong>„Meine Ölheizung rußt. Sind die Abgase gefährlich? Und woran erkennt man eine gute Verbrennung?“</strong></p><div class=\"task\"><strong>Ihr seid gefragt!</strong><p>Formuliert zu zweit zwei Rückfragen an den Kunden. Was müsst ihr als Fachkräfte überprüfen?</p></div>"],["Impuls 1 · Bestandteile von Abgasen","<p>Bei der Verbrennung von Heizöl entstehen u. a. <strong>CO₂ und Wasserdampf</strong>. Stickstoff aus der Luft und überschüssiger Sauerstoff können ebenfalls im Abgas vorkommen. Problematische Stoffe sind unter anderem <strong>CO, NOₓ, SO₂ und Ruß</strong>.</p><div class=\"task\"><strong>Aufgabe an die SuS</strong><p>Ordnet CO₂, H₂O, N₂, O₂, CO und Ruß den Gruppen „typische Verbrennungsprodukte“, „aus der Luft“ und „Hinweise auf unvollständige Verbrennung“ zu.</p><button class=\"reveal\">Musterantwort anzeigen</button><div class=\"answer\" hidden>CO₂ und H₂O: typische Produkte; N₂ und restliches O₂: Luftbestandteile; CO und Ruß: können bei unvollständiger Verbrennung entstehen. Die Gruppen beziehen sich auf die Herkunft beziehungsweise Entstehung.</div></div>"],["Impuls 2 · Zwei Reaktionen","<p>Bei vollständiger Kohlenstoffverbrennung entsteht CO₂. Bei unvollständiger Verbrennung kann CO entstehen.</p><div class=\"eq\">C + O₂ → CO₂<br>2 C + O₂ → 2 CO</div><div class=\"task\"><strong>Aufgabe an die SuS</strong><p>Vergleicht die Reaktionen: Warum kann ein rußender Brenner auf eine Störung hindeuten? Erklärt es eurem Sitznachbarn.</p></div>"],["Impuls 3 · Luftzahl λ","<p>Für eine saubere Verbrennung braucht es eine gute Vermischung von Luft und Brennstoff. Die Luftzahl beschreibt den Luftüberschuss.</p><div class=\"eq\">λ = zugeführte Luftmenge / theoretisch benötigte Luftmenge</div><div class=\"task\"><strong>Aufgabe an die SuS</strong><p>Was ist sinnvoll: möglichst wenig Luft, möglichst viel Luft oder ein passend eingestellter Luftüberschuss? Begründet.</p><button class=\"reveal\">Lösung aufdecken</button><div class=\"answer\" hidden>Ein passend eingestellter Luftüberschuss: zu wenig Luft kann CO und Ruß begünstigen, zu viel Luft kann Abgasverluste erhöhen.</div></div>"],["Impuls 4 · Was verraten Messwerte?","<p>Bei der Abgasmessung spielen unter anderem <strong>O₂, CO₂, CO, Abgastemperatur und Rußzahl</strong> eine Rolle.</p><div class=\"task\"><strong>Aufgabe an die SuS</strong><p>Ordnet zu: Welche Messgröße weist auf giftiges Gas hin? Welche hilft bei der Beurteilung des Luftüberschusses? Welche erfasst Ruß?</p><button class=\"reveal\">Lösung aufdecken</button><div class=\"answer\" hidden>CO-Messwert → giftiges Kohlenstoffmonoxid; O₂-Gehalt → Luftüberschuss beurteilen; Rußzahl → Rußbelastung. Eine fachliche Bewertung berücksichtigt mehrere Werte und den Brennerzustand.</div></div>"],["Impuls 5 · Umwelt und Gesundheit","<p><strong>CO₂:</strong> klimawirksam. <strong>CO:</strong> giftig und geruchlos. <strong>NOₓ, SO₂ und Partikel:</strong> belasten Umwelt und Gesundheit.</p><div class=\"task\"><strong>Aufgabe an die SuS</strong><p>Erstellt eine kleine Tabelle mit drei Spalten: Stoff – Wirkung – mögliche Maßnahme. Wählt drei Stoffe aus.</p></div>"],["Impuls 6 · Fachlich richtig reagieren","<p>Ruß oder ungewöhnlicher Geruch sind Warnzeichen – aber keine sichere Diagnose. Eine Untersuchung der Anlage ist notwendig. Kohlenstoffmonoxid ist <strong>geruchlos</strong>.</p><div class=\"task\"><strong>Aufgabe an die SuS</strong><p>Bewertet die Aussage: „Der Brenner hat definitiv zu wenig Luft.“ Formuliert eine fachlich bessere Antwort.</p><button class=\"reveal\">Lösung aufdecken</button><div class=\"answer\" hidden>Diese Diagnose ist ohne Messung nicht sicher. Besser: „Ruß kann durch unvollständige Verbrennung entstehen. Ein Fachbetrieb muss Luftversorgung, Brenner und Abgaswerte prüfen.“</div></div>"],["Abschluss · Kundenantwort","<p>Der Kunde erwartet eine verständliche Empfehlung.</p><div class=\"task\"><strong>Aufgabe an die SuS</strong><p>Formuliert eine Antwort in 3–4 Sätzen: Was kann Ruß bedeuten? Welche Gefahren gibt es? Was ist der nächste Schritt?</p><button class=\"reveal\">Musterantwort aufdecken</button><div class=\"answer\" hidden>„Ruß kann auf eine unvollständige Verbrennung hinweisen. Dabei kann gefährliches Kohlenstoffmonoxid entstehen. Lassen Sie die Anlage zeitnah vom Fachbetrieb prüfen. Bei Verdacht auf Abgasaustritt verlassen Sie den Gefahrenbereich und holen Hilfe; anschließend müssen Brenner, Luftversorgung und Abgaswerte fachgerecht geprüft werden.“</div></div>"]];slides.splice(slides.length-1,0,["Impuls 5 · Rechtsgrundlage: 1. BImSchV","<p>Die <strong>Erste Verordnung zur Durchführung des Bundes-Immissionsschutzgesetzes (1. BImSchV)</strong> regelt Anforderungen an kleine und mittlere Feuerungsanlagen. Für unseren Kundenauftrag betrachten wir eine <strong>Ölheizung mit Zerstäubungsbrenner</strong>.</p><div class=\"eq\">§ 8: Rußzahl ≤ 1 · CO ≤ 1.300 mg/kWh · keine Ölderivate im Abgas</div><p>Bei bestimmten alten Anlagen kann für die Rußzahl eine Ausnahme gelten. Bei Verdampfungsbrennern gelten andere Rußzahlgrenzen (§ 7).</p><div class=\"task\"><strong>Expertenauftrag</strong><p>Recherchiert in § 8 der 1. BImSchV: Welche Grenzwerte gelten für die konkrete Feuerstätte und welche Ausnahmen kommen in Betracht?</p><a href=\"https://www.gesetze-im-internet.de/bimschv_1_2010/__8.html\" target=\"_blank\" rel=\"noopener\">Amtlicher Gesetzestext: § 8 1. BImSchV ↗</a></div>"],["Impuls 6 · Grenzwerte richtig zuordnen","<p><strong>Nicht jede Anzeige am Abgasmessgerät hat einen gesetzlichen Höchstwert!</strong> Entscheidend sind Brennstoff, Bauart, Leistung und die zutreffende Vorschrift.</p><table class=\"limits\"><thead><tr><th>Messgröße</th><th>Einordnung bei Ölheizung</th></tr></thead><tbody><tr><td>Rußzahl</td><td>≤ 1 für Zerstäubungsbrenner (Regelfall; § 8)</td></tr><tr><td>CO</td><td>≤ 1.300 mg/kWh (§ 8); nicht mit ppm verwechseln</td></tr><tr><td>Abgasverlust</td><td>4–25 kW: ≤ 11 %; über 25–50 kW: ≤ 10 %; über 50 kW: ≤ 9 % (§ 10; Ausnahmen möglich)</td></tr><tr><td>NOₓ (als NO₂)</td><td>Heizöl EL: bis 120 kW ≤ 110 mg/kWh, über 120–400 kW ≤ 120 mg/kWh, über 400 kW ≤ 185 mg/kWh (§ 6, für bestimmte Anlagen ab 22.03.2010; Hersteller-Nachweis unter Prüfbedingungen)</td></tr><tr><td>O₂ / CO₂</td><td>Kein pauschaler gesetzlicher Grenzwert in der 1. BImSchV; Diagnose- und Einstellgrößen nach Herstellerangaben</td></tr><tr><td>SO₂</td><td>Kein einheitlicher Betriebs-Messgrenzwert dieser Art in der 1. BImSchV für den hier betrachteten kleinen Ölkessel; Brennstoffqualität ist wichtig</td></tr></tbody></table><p><strong>Achtung:</strong> Die NOₓ-Herstellerprüfung ist nicht mit einer routinemäßigen Abgasmessung am eingebauten Gerät gleichzusetzen. Sonderregelungen und Ausnahmen sind im Einzelfall zu prüfen.</p><div class=\"task\"><strong>Messprotokoll beurteilen</strong><p>Ein Ölbrenner (Zerstäubungsbrenner), 20 kW, zeigt Rußzahl 2 und einen Abgasverlust von 8 %. Welcher Messwert ist im Regelfall unzulässig?</p><button class=\"reveal\">Musterantwort anzeigen</button><div class=\"answer\" hidden>Rußzahl 2 überschreitet beim üblichen Zerstäubungsbrenner den Grenzwert 1 (§ 8). Der Abgasverlust 8 % unterschreitet den allgemeinen Grenzwert 11 % bei 20 kW (§ 10). Baujahr und mögliche Ausnahmen sind zusätzlich zu berücksichtigen.</div></div><p class=\"source\">Quellen: <a href=\"https://www.gesetze-im-internet.de/bimschv_1_2010/__6.html\" target=\"_blank\" rel=\"noopener\">§ 6</a> · <a href=\"https://www.gesetze-im-internet.de/bimschv_1_2010/__8.html\" target=\"_blank\" rel=\"noopener\">§ 8</a> · <a href=\"https://www.gesetze-im-internet.de/bimschv_1_2010/__10.html\" target=\"_blank\" rel=\"noopener\">§ 10</a></p>"],["Impuls 7 · Wie wird die Rußzahl gemessen?","<p>Die Rußzahl wird bei Ölheizungen mit einer <strong>Rußpumpe, geeignetem Filterpapier und einer Rußzahl-Vergleichsskala</strong> ermittelt – nicht allein über die CO- oder O₂-Anzeige des elektronischen Abgasmessgeräts.</p><ol><li>Die Anlage unter den vorgeschriebenen Betriebs- und Messbedingungen prüfen; Messstelle im Abgasweg nutzen.</li><li>Mit der Rußpumpe eine definierte Abgasprobe durch das Filterpapier ziehen. Rußpartikel hinterlassen eine Schwärzung.</li><li>Die Schwärzung mit der Vergleichsskala (0 = hell, höhere Zahlen = stärker geschwärzt) vergleichen.</li><li><strong>Drei Einzelmessungen</strong> durchführen; auffällig feuchte oder ungleichmäßig geschwärzte Proben ersetzen.</li><li>Rußzahlen sowie Mittelwert dokumentieren und das Filterpapier auf <strong>Ölderivate</strong> prüfen.</li></ol><p>Rechtsgrundlage: <strong>Anlage 2 Nr. 3.2 der 1. BImSchV</strong>, Verfahren nach DIN 51402-1. Die praktische Durchführung erfolgt durch unterwiesene Fachkräfte mit geeigneter Ausrüstung.</p><div class=\"task\"><strong>Praxisfrage</strong><p>Warum reichen ein einzelner dunkler Fleck oder ein hoher CO-Messwert nicht aus, um die Rußzahl normgerecht anzugeben?</p><button class=\"reveal\">Musterantwort anzeigen</button><div class=\"answer\" hidden>Die Rußzahl ist ein eigenständiger Filterpapier-/Vergleichsskalen-Messwert. Die Verordnung verlangt drei Einzelmessungen unter definierten Bedingungen. CO wird mit einem anderen Messverfahren ermittelt.</div></div><p class=\"source\"><a href=\"https://www.gesetze-im-internet.de/bimschv_1_2010/anlage_2.html\" target=\"_blank\" rel=\"noopener\">Amtliche Messvorschrift: Anlage 2 der 1. BImSchV ↗</a></p>"]);let index=0;const stage=document.getElementById('stage'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),dots=document.getElementById('dots');function render(){stage.innerHTML='<span class="pill">Folie '+(index+1)+'</span><h2>'+slides[index][0]+'</h2>'+slides[index][1];counter.textContent=(index+1)+' / '+slides.length;prev.disabled=index===0;next.textContent=index===slides.length-1?'Von vorne ↻':'Weiter →';dots.innerHTML=slides.map((_,i)=>'<button type="button" aria-label="Folie '+(i+1)+'" '+(i===index?'aria-current="step"':'')+'></button>').join('');dots.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{index=i;render()});stage.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{b.nextElementSibling.hidden=false;b.hidden=true})}prev.onclick=()=>{if(index){index--;render()}};next.onclick=()=>{index=index===slides.length-1?0:index+1;render()};render();
</script></body></html>

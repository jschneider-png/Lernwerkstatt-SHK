<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundenauftrag · Verbrennung verstehen</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17364d;background:#edf5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top a{font-weight:800;color:#23658b;text-decoration:none}.pill{background:#dceaf2;border-radius:20px;padding:7px 12px;font-weight:800;font-size:.82rem}.stage{background:white;border:1px solid #c8dce8;border-radius:22px;min-height:410px;padding:clamp(20px,5vw,48px);margin:20px 0;box-shadow:0 16px 40px #17405c16}h1{font-size:clamp(1.4rem,3vw,2rem)}h2{font-size:clamp(1.45rem,4vw,2.3rem)}p,li{font-size:clamp(1.05rem,2vw,1.2rem);line-height:1.65}.formula{background:#e6f2f8;border-left:5px solid #23658b;border-radius:10px;padding:17px;font-size:clamp(1.07rem,2.5vw,1.4rem);font-weight:750;line-height:1.6;margin:16px 0}.tip{background:#fff4dd;border-left:5px solid #e9a43c;border-radius:9px;padding:14px;line-height:1.6}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.nav button,.answerbtn{border:0;border-radius:12px;background:#23658b;color:white;font:800 1rem system-ui;padding:13px 18px;cursor:pointer}.nav button:disabled{opacity:.4;cursor:not-allowed}.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:17px}.dots button{border:0;border-radius:15px;background:#b4cbd8;height:10px;width:27px;cursor:pointer}.dots button[aria-current="step"]{background:#23658b}.answer[hidden]{display:none!important}.codehint{margin:20px 0 0;padding:12px 15px;border:1px dashed #7ba5bc;border-radius:12px;background:#f2f8fb;font-size:1rem}.codeletter{display:inline-flex;align-items:center;justify-content:center;background:#23658b;color:white;border-radius:8px;min-width:34px;min-height:34px;font-size:1.3rem;font-weight:900;margin-left:6px}.codeform{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}.codeform input{padding:12px;border:2px solid #96b4c6;border-radius:10px;font:700 1rem system-ui;max-width:230px;text-transform:uppercase;letter-spacing:.12em}.codeerror{color:#9a3030;font-weight:700}.codeerror[hidden]{display:none!important}
.quizchoices{display:grid;gap:9px;margin:12px 0}.quizoption{border:1px solid #8daebf;border-radius:10px;background:#fff;color:#17364d;text-align:left;padding:12px;font:600 1rem system-ui;cursor:pointer}.quizoption:hover:not(:disabled){background:#e6f2f8}.quizoption:disabled{opacity:.65;cursor:default}#quizfeedback{font-size:1rem}</style></head><body><main class="wrap"><div class="top"><a href="lernpfad.html?bw=2">← Zurück zum Lernpfad</a><span class="pill">BW 2 · Stunde 3</span></div><h1>Kundenauftrag: Warum rußt die Ölheizung?</h1><section class="stage" id="stage" aria-live="polite"></section><nav class="nav"><button id="prev" type="button">← Zurück</button><strong id="counter"></strong><button id="next" type="button">Weiter →</button></nav><div class="dots" id="dots"></div></main><script>
const slides=[
['Ein Kunde meldet sich','<p>„Meine Ölheizung rußt plötzlich. Außerdem riecht es im Heizraum ungewöhnlich. Muss ich mir Sorgen machen?“</p><p><strong>Auftrag:</strong> Erkläre, wie eine richtige Verbrennung funktioniert, welche Fehler denkbar sind und was fachgerecht zu prüfen ist.</p><div class="tip"><strong>Sicherheit:</strong> Bei auffälligem Geruch, Ruß oder vermutetem Abgasaustritt Anlage nicht selbst einstellen. Fachbetrieb einschalten; bei Verdacht auf CO/Abgasaustritt Bereich verlassen und Hilfe rufen.</div>'],
['1 · Was brauchen wir zum Verbrennen?','<p>Eine Verbrennung braucht drei Voraussetzungen:</p><ul><li><strong>Brennstoff</strong> – hier Heizöl</li><li><strong>Sauerstoff</strong> aus der Verbrennungsluft</li><li><strong>Zündenergie</strong> beziehungsweise ausreichend hohe Temperatur</li></ul><div class="tip">Denkfrage: Was passiert, wenn eine der drei Voraussetzungen fehlt?</div>'],
['2 · Was steckt im Heizöl?','<p>Heizöl besteht überwiegend aus Kohlenwasserstoffen. Diese enthalten <strong>Kohlenstoff (C)</strong> und <strong>Wasserstoff (H)</strong>.</p><p>Bei vollständiger Verbrennung reagieren diese mit Sauerstoff. Dabei wird Wärme frei.</p>'],
['3 · Vollständige Verbrennung','<p>Bei ausreichender Sauerstoffzufuhr entstehen vor allem <strong>Kohlenstoffdioxid (CO₂)</strong> und <strong>Wasser (H₂O)</strong>.</p><div class="formula">C + O₂ → CO₂<br>2 H₂ + O₂ → 2 H₂O</div><p>Dies sind vereinfachte Teilreaktionen – Heizöl ist ein Gemisch und hat keine einzelne exakte Summenformel.</p>'],
['4 · Unvollständige Verbrennung','<p>Wenn Brennstoff und Luft nicht richtig gemischt werden oder örtlich zu wenig Sauerstoff vorhanden ist, kann die Verbrennung unvollständig sein.</p><div class="formula">2 C + O₂ → 2 CO</div><p>Dabei können <strong>Kohlenstoffmonoxid (CO)</strong>, unverbrannte Bestandteile und <strong>Ruß</strong> entstehen.</p><div class="tip">CO ist giftig, unsichtbar und geruchlos. Ein ungewöhnlicher Geruch allein ist kein zuverlässiger CO-Nachweis.</div>'],
['5 · Warum braucht man Luftüberschuss?','<p>In der Praxis wird etwas mehr Luft zugeführt als theoretisch für eine vollständige Verbrennung nötig wäre.</p><div class="formula">Luftzahl λ = tatsächlich zugeführte Luftmenge / theoretisch benötigte Luftmenge</div><p><strong>λ = 1:</strong> theoretisch genau benötigte Luftmenge. <strong>λ &gt; 1:</strong> Luftüberschuss.</p><p>Zu wenig Luft kann CO und Ruß fördern; zu viel Luft kann Abgasverluste erhöhen.</p>'],
['6 · Was könnte beim Kunden falsch laufen?','<p>Mögliche Ursachen für die Rußbildung sind beispielsweise:</p><ul><li>unzureichende Luftversorgung</li><li>schlechte Zerstäubung oder ungeeignete Brennereinstellung</li><li>verschmutzte Bauteile oder eine fehlerhafte Luft-Brennstoff-Mischung</li></ul><p>Aus der Kundenbeschreibung lässt sich die Ursache <strong>nicht sicher diagnostizieren</strong>.</p>'],
['7 · Was kontrolliert ein Fachbetrieb?','<p>Ein Fachbetrieb überprüft unter anderem Brennerzustand, Luftversorgung sowie Verbrennungs- und Abgaswerte mit geeigneten Messgeräten.</p><p>Wichtige Größen sind beispielsweise <strong>O₂, CO₂, CO, Abgastemperatur und Rußzahl</strong>.</p><div class="tip">Messwerte sind nötig, bevor Einstellungen verändert oder Aussagen zur Verbrennungsqualität getroffen werden.</div>'],
['8 · Kurze Selbstkontrolle','<p>Beantworte vor dem Aufdecken:</p><ol><li>Welche drei Voraussetzungen braucht eine Verbrennung?</li><li>Was unterscheidet CO von CO₂?</li><li>Warum ist „möglichst viel Verbrennungsluft“ keine gute Grundregel?</li></ol><button class="answerbtn" id="reveal" type="button" aria-controls="answer" aria-expanded="false">Musterantwort zeigen</button><div class="answer" id="answer" hidden><p><strong>1.</strong> Brennstoff, Sauerstoff, Zündenergie. <strong>2.</strong> CO kann bei unvollständiger Verbrennung entstehen und ist hochgiftig; CO₂ entsteht bei vollständiger Kohlenstoffverbrennung. <strong>3.</strong> Zu viel Luft kann die Abgasverluste erhöhen. Entscheidend ist eine fachgerecht eingestellte Verbrennung.</p></div>'],
['9 · Expertenauftrag: Fachliche Handlungsempfehlung','<p><strong>Ihr seid die zuständigen SHK-Fachkräfte.</strong> Der Kunde berichtet von plötzlicher Rußbildung und ungewöhnlichem Geruch im Heizraum. Er erwartet eine technisch begründete Einschätzung.</p><p><strong>Euer Auftrag:</strong> Formuliert eine fachgerechte Stellungnahme, in der ihr</p><ol><li>mögliche Ursachen der Rußbildung anhand des Verbrennungsprozesses erklärt,</li><li>notwendige Prüfungen und Messgrößen benennt,</li><li>geeignete Maßnahmen zur Störungsbehebung empfehlt,</li><li>eure Empfehlungen fachlich begründet und zwischen Vermutung und gesichertem Befund unterscheidet.</li></ol><div class="tip"><strong>Fachsprache:</strong> Verwendet Verbrennungsluft, Luftüberschuss, unvollständige Verbrennung, CO, Rußzahl und Abgasmessung fachlich korrekt. <strong>Sicherheit:</strong> Bei Verdacht auf Abgasaustritt zuerst Gefahrenabwehr, keine weiteren Einstellversuche.</div><p>Vergleicht eure eigene Stellungnahme erst danach mit der Musterlösung.</p><form id="codeform" class="codeform"><label for="codeinput"><strong>Lösungswort (9 Buchstaben):</strong></label><input id="codeinput" type="text" minlength="9" maxlength="9" autocomplete="off" spellcheck="false" required aria-describedby="codeerror" placeholder="Lösungswort"><button class="answerbtn" id="reveal" type="submit" aria-controls="answer" aria-expanded="false">Musterlösung freischalten</button></form><p id="codeerror" class="codeerror" role="status" hidden>Das Lösungswort ist noch nicht richtig. Sammle die Buchstaben auf Folie 1 bis 9 in der richtigen Reihenfolge.</p><div class="answer" id="answer" hidden><h3>Beispiel einer fachlichen Stellungnahme</h3><p><strong>Technische Beurteilung:</strong> Die Rußbildung weist auf eine gestörte beziehungsweise unvollständige Verbrennung hin. Als Ursachen kommen insbesondere eine unzureichende Verbrennungsluftversorgung, eine mangelhafte Heizölzerstäubung sowie eine fehlerhafte Luft-Brennstoff-Mischung in Betracht. Aus der Kundenmeldung allein ist keine eindeutige Diagnose möglich.</p><p><strong>Prüf- und Messkonzept:</strong> Zunächst prüfen wir die sichere Betriebsfähigkeit der Anlage und mögliche Abgasundichtigkeiten. Anschließend kontrollieren wir die Verbrennungsluftversorgung, den Brennerzustand, die Öldüse und relevante Brennerbauteile. Eine fachgerechte Abgasmessung umfasst unter anderem O₂-, CO- und gegebenenfalls CO₂-Werte, die Abgastemperatur sowie die Rußzahl. Die Werte werden mit den Herstellervorgaben und den geltenden Anforderungen abgeglichen.</p><p><strong>Handlungsempfehlung:</strong> Festgestellte Mängel werden fachgerecht behoben, beispielsweise durch Reinigung, Austausch defekter Bauteile oder Korrektur der Luft- beziehungsweise Brennereinstellung nach Herstellervorgaben. Anschließend überprüfen wir die Verbrennungsqualität und die Betriebssicherheit durch eine erneute Messung.</p><p><strong>Fachliches Fazit:</strong> Ziel ist eine stabile, möglichst vollständige und sichere Verbrennung bei angemessenem Luftüberschuss. Eine belastbare Aussage zur Störungsursache und zur Wirksamkeit der Maßnahmen ist erst anhand der Prüf- und Messergebnisse möglich.</p><div class="tip"><strong>Wichtig:</strong> Wegen des ungewöhnlichen Geruchs muss ein möglicher Abgasaustritt sicherheitsorientiert abgeklärt werden. CO selbst ist geruchlos.</div></div>']
];
const codeLetters=['F','A','C','H','K','R','A','F','T'];
const questions=[
{q:'Was hat beim gemeldeten ungewöhnlichen Geruch im Heizraum Vorrang?',a:['Die Brennerluft sofort nachstellen','Einen möglichen Abgasaustritt sicherheitsorientiert abklären','Die Anlage zunächst weiterlaufen lassen'],correct:1,hint:'Denke an die Sicherheit, bevor technische Einstellungen erfolgen.'},
{q:'Welche drei Bedingungen gehören zum Verbrennungsdreieck?',a:['Brennstoff, Sauerstoff und Zündenergie','Heizöl, Wasser und CO₂','Sauerstoff, CO₂ und Ruß'],correct:0,hint:'Es sind Stoff, Oxidationsmittel und Startenergie nötig.'},
{q:'Welche Elemente sind wesentliche Bestandteile der Kohlenwasserstoffe im Heizöl?',a:['Sauerstoff und Stickstoff','Eisen und Schwefel','Kohlenstoff und Wasserstoff'],correct:2,hint:'Der Name Kohlenwasserstoff verrät die Antwort.'},
{q:'Welche Produkte entstehen bei vollständiger Verbrennung der Kohlenwasserstoffe überwiegend?',a:['CO und Ruß','CO₂ und H₂O','Nur Sauerstoff'],correct:1,hint:'Betrachte die Reaktionsprodukte von Kohlenstoff und Wasserstoff bei ausreichendem Sauerstoff.'},
{q:'Welche Aussage zur unvollständigen Verbrennung trifft zu?',a:['Dabei können CO und Ruß entstehen','Sie erzeugt grundsätzlich nur CO₂ und Wasser','CO lässt sich am Geruch erkennen'],correct:0,hint:'CO ist giftig und geruchlos; Ruß weist auf gestörte Verbrennung hin.'},
{q:'Warum ist ein möglichst großer Luftüberschuss kein sinnvolles Einstellziel?',a:['Weil dann kein Sauerstoff vorhanden ist','Weil Ruß dadurch immer zunimmt','Weil zu viel Luft Abgasverluste erhöhen kann'],correct:2,hint:'Beachte den Einfluss unnötig erwärmter Luft auf den Wirkungsgrad.'},
{q:'Was ist bei der Kundenmeldung fachlich korrekt?',a:['Die Öldüse ist sicher defekt','Die Ursache ist noch nicht eindeutig diagnostiziert','Eine Abgasmessung ist nicht erforderlich'],correct:1,hint:'Vermutete Ursachen müssen durch Prüfung und Messung bestätigt werden.'},
{q:'Welche Größen sind zur Beurteilung der Verbrennung relevant?',a:['Nur Raumtemperatur und Wasserhärte','Nur Öltankfüllstand und Außentemperatur','O₂, CO, Abgastemperatur und Rußzahl'],correct:2,hint:'Gesucht sind Größen der Verbrennung und des Abgases.'},
{q:'Welche fachliche Schlussfolgerung ist für den Kundenauftrag richtig?',a:['Ohne Messung wird der Brenner versuchsweise verstellt','Nach sicherheitsorientierter Prüfung werden Ursachen ermittelt, Mängel behoben und Messwerte kontrolliert','Rußbildung kann ohne Prüfung als normal bewertet werden'],correct:1,hint:'Eine fachgerechte Handlungsempfehlung stützt sich auf Befunde und Kontrollmessungen.'}
];
const solved=Array(9).fill(false);
const checkCode=value=>value.trim().toUpperCase()===codeLetters.join('');
let i=0;const stage=document.getElementById('stage'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),dots=document.getElementById('dots');
const opened=Array(9).fill(false);
function quizMarkup(n){
 const q=questions[n];
 const toggle='<button type="button" class="answerbtn quiztoggle" aria-expanded="'+opened[n]+'" aria-controls="quizpanel" id="quiztoggle">'+(opened[n]?'Expertenfrage schließen':solved[n]?'Expertenfrage erneut ansehen':'Expertenfrage öffnen')+'</button>';
 if(!opened[n])return '<div class="codehint"><strong>Expertencheck · Folie '+(n+1)+'</strong><p>Prüfe dein Fachwissen, wenn du die Inhalte bearbeitet hast.</p>'+toggle+(solved[n]?'<p><strong>Codebuchstabe verdient:</strong> <span class="codeletter">'+codeLetters[n]+'</span></p>':'')+'</div>';
 return '<div class="codehint"><strong>Expertencheck · Folie '+(n+1)+'</strong><p>'+toggle+'</p><div id="quizpanel"><p>'+q.q+'</p><div class="quizchoices">'+q.a.map((a,k)=>'<button type="button" class="quizoption" data-choice="'+k+'" '+(solved[n]?'disabled':'')+'>'+String.fromCharCode(65+k)+'. '+a+'</button>').join('')+'</div><p id="quizfeedback" role="status" aria-live="polite">'+(solved[n]?'Richtig beantwortet!':'Wähle die fachlich richtige Antwort.')+'</p>'+(solved[n]?'<p><strong>Dein Codebuchstabe:</strong> <span class="codeletter">'+codeLetters[n]+'</span> · Notiere ihn.</p>':'')+'</div></div>';
}
function render(){
 stage.innerHTML='<span class="pill">Folie '+(i+1)+'</span><h2>'+slides[i][0]+'</h2>'+slides[i][1]+quizMarkup(i);
 prev.disabled=i===0;next.textContent=i===slides.length-1?'Von vorne ↻':'Weiter →';counter.textContent=(i+1)+' / '+slides.length;
 dots.innerHTML=slides.map((_,n)=>'<button type="button" aria-label="Folie '+(n+1)+(solved[n]?', Expertencheck geschafft':'')+'" '+(n===i?'aria-current="step"':'')+'></button>').join('');
 dots.querySelectorAll('button').forEach((b,n)=>b.onclick=()=>{i=n;render()});
 const toggle=document.getElementById('quiztoggle');if(toggle)toggle.onclick=()=>{opened[i]=!opened[i];render()};
 stage.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
   if(solved[i])return;
   if(Number(b.dataset.choice)===questions[i].correct){solved[i]=true;render()}
   else{document.getElementById('quizfeedback').textContent='Noch nicht richtig. Hinweis: '+questions[i].hint}
 });
 const form=document.getElementById('codeform');
 if(form)form.addEventListener('submit',event=>{
   event.preventDefault();
   const input=document.getElementById('codeinput'),error=document.getElementById('codeerror'),answer=document.getElementById('answer');
   if(!solved.every(Boolean)){error.hidden=false;error.textContent='Bearbeite zuerst die Expertenchecks auf allen neun Folien.';return}
   if(checkCode(input.value)){answer.hidden=false;form.hidden=true;error.hidden=true}
   else{error.hidden=false;error.textContent='Das Lösungswort ist noch nicht richtig. Ordne die neun Buchstaben nach Foliennummer.';input.focus()}
 });
 const r=document.getElementById('reveal');
 if(r&&!form)r.onclick=()=>{document.getElementById('answer').hidden=false;r.setAttribute('aria-expanded','true');r.hidden=true};
}
prev.onclick=()=>{if(i){i--;render()}};next.onclick=()=>{i=i===slides.length-1?0:i+1;render()};render();
</script><script defer src="../shk-navigation.js"></script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zusammenfassung · Heizöl zu Pellets</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#14354c;background:#edf5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:950px;margin:0 auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{color:#23658b;text-decoration:none;font-weight:800}.pill{background:#dcecf4;padding:7px 12px;border-radius:22px;font-weight:800;font-size:.85rem}.stage{background:#fff;border:1px solid #c9dce7;border-radius:22px;padding:clamp(20px,5vw,54px);min-height:390px;margin:20px 0;box-shadow:0 20px 40px #17405c12}h1{font-size:clamp(1.3rem,3vw,2rem)}h2{font-size:clamp(1.5rem,4vw,2.3rem);margin:14px 0}p,li{line-height:1.7;font-size:clamp(1.05rem,2vw,1.22rem)}.formula{background:#e6f3fa;border-left:6px solid #23658b;border-radius:12px;padding:18px 22px;font-size:clamp(1.22rem,3vw,1.7rem);font-weight:850;margin:20px 0;line-height:1.7}.tip{background:#fff5de;border-left:5px solid #eaa33c;padding:16px;border-radius:10px;line-height:1.5}.nav{display:flex;align-items:center;justify-content:space-between;gap:15px}.nav button,.answerbtn{border:0;border-radius:12px;background:#23658b;color:white;padding:14px 20px;font:800 1rem system-ui;cursor:pointer}.nav button:disabled{opacity:.4;cursor:not-allowed}.nav #counter{font-weight:800}.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:18px 0}.dots button{border:0;border-radius:15px;background:#b9d0dc;width:26px;height:9px;cursor:pointer}.dots button[aria-current="step"]{background:#23658b}.answer{display:none}.answer.open{display:block}@media(max-width:550px){.stage{min-height:420px}.nav button{padding:12px}}
</style></head><body><main class="wrap"><div class="top"><a href="lernpfad.html?bw=2">← Zurück zu Blockwoche 2</a><span class="pill">Stunde 1 · Zusammenfassung</span></div><h1>Wie viel Heizöl entspricht wie vielen Pellets?</h1><section class="stage" id="stage" aria-live="polite"></section><nav class="nav"><button type="button" id="prev">← Zurück</button><span id="counter"></span><button type="button" id="next">Weiter →</button></nav><div class="dots" id="dots"></div></main><script>
const slides=[
["Der Kundenauftrag",'<p>Ein Kunde sagt: <strong>„Ich brauche 2.500 Liter Heizöl. Wie viele Holzpellets wären das?“</strong></p><p>Wir wollen ihm nicht einfach eine Zahl nennen, sondern die <strong>Rechnung verständlich erklären</strong>.</p>'],
["Was ist gegeben – was ist gesucht?",'<p><strong>Gegeben:</strong> 2.500 l Heizöl.</p><p>Für unsere Überschlagsrechnung verwenden wir: Heizwert Heizöl <strong>10 kWh/l</strong>, Heizwert Pellets <strong>5 kWh/kg</strong>.</p><p><strong>Gesucht:</strong> Pelletmasse <em>m</em> in Kilogramm und Tonnen.</p><div class="tip">Warum kann man Liter nicht direkt in Kilogramm umwandeln? Es sind unterschiedliche Größen!</div>'],
["Was bedeutet Heizwert?",'<p>Der Heizwert H<sub>u</sub> sagt, wie viel Energie ein Brennstoff pro Liter oder pro Kilogramm liefern kann, ohne die Kondensationswärme des Wasserdampfs mitzuzählen.</p><p>Öl: <strong>10 kWh je Liter</strong>. Pellets: <strong>5 kWh je Kilogramm</strong>.</p><div class="tip">Unser gemeinsamer Vergleichsmaßstab ist die <strong>Energie in kWh</strong>.</div>'],
["1. Formel bestimmen",'<p>Wie viel Energie steckt in den 2.500 Litern Heizöl?</p><div class="formula">Energie = Menge × Heizwert<br>Q<sub>Öl</sub> = V<sub>Öl</sub> × H<sub>u,Öl</sub></div><p><strong>Einheitenprüfung:</strong> l × (kWh/l) = kWh.</p>'],
["2. Heizölenergie berechnen",'<div class="formula">Q<sub>Öl</sub> = 2.500 l × 10 kWh/l<br>= 25.000 kWh</div><p>Diese Energiemenge soll durch die Pellets bereitgestellt werden.</p><div class="tip">Zwischenergebnis: <strong>25.000 kWh</strong> notieren!</div>'],
["Zusatz: Die Anlage des Kunden",'<p>Bekannt sind: <strong>22 kW Ölkessel</strong>, Heizung η = <strong>88 %</strong>, Warmwasser η = <strong>75 %</strong>, Jahreswarmwasser <strong>50 m³/a</strong>, Erwärmung von <strong>10 auf 60 °C</strong>, Warmwasserspeicher <strong>180 l</strong>.</p><div class="tip"><strong>Wichtige Annahme:</strong> Die 2.500 l Heizöl sind der gesamte Jahresverbrauch für <strong>Raumheizung und Warmwasser zusammen</strong>.</div>'],
["Warmwasser: Wärmemenge berechnen",'<p>50 m³ Warmwasser = <strong>50.000 kg Wasser</strong> (vereinfacht 1 kg/l). Die Temperaturdifferenz beträgt 60 − 10 = <strong>50 K</strong>.</p><div class="formula">Q<sub>WW</sub> = m × c × ΔT<br>= 50.000 kg × 1,163 Wh/(kg·K) × 50 K<br>= 2.907.500 Wh = 2.907,5 kWh/a</div><p>Das ist die jährlich benötigte Nutzwärme zur Warmwassererwärmung.</p>'],
["Warmwasser: Heizölmenge berechnen",'<p>Wegen des Wirkungsgrads von 75 % muss mehr Brennstoffenergie eingesetzt werden.</p><div class="formula">Q<sub>Öl,WW</sub> = 2.907,5 / 0,75<br>≈ 3.877 kWh/a</div><div class="formula">V<sub>Öl,WW</sub> = 3.877 / (10 kWh/l)<br>≈ 388 l/a</div><p>Rund <strong>388 Liter Heizöl pro Jahr</strong> entfallen rechnerisch auf das Warmwasser.</p>'],
["Raumheizung: Woher kommen die 2.112 l?",'<p>Der gesamte Jahresverbrauch ist bereits bekannt: <strong>2.500 l</strong>. Davon ziehen wir den für Warmwasser berechneten Teil ab.</p><div class="formula">V<sub>Öl,Heizung</sub> = V<sub>gesamt</sub> − V<sub>Öl,WW</sub><br>= 2.500 l − 388 l<br>= 2.112 l/a</div><p>Also: <strong>388 l Warmwasser + 2.112 l Raumheizung = 2.500 l Heizöl</strong>.</p><div class="tip">Die 2.112 l sind der <strong>Rest aus dem bekannten Gesamtverbrauch</strong>, keine Berechnung allein aus der Kesselleistung.</div>'],
["Was sagen uns 22 kW, 88 % und 180 l?",'<p><strong>22 kW</strong> ist eine Leistung. Ohne Betriebsstunden bzw. Wärmebedarf lässt sich damit kein Jahresverbrauch berechnen.</p><p>Mit <strong>88 %</strong> Heizungswirkungsgrad entsprechen die 2.112 l Heizöl ungefähr:</p><div class="formula">Q<sub>Nutz,Heizung</sub> = 2.112 × 10 × 0,88<br>≈ 18.586 kWh/a</div><p>Der <strong>180-l-Speicher</strong> beschreibt den Inhalt für eine einzelne Speicherfüllung, nicht zusätzliche 180 l pro Jahr. Die 50 m³/a berücksichtigen bereits die jährlich gezapfte Wassermenge.</p><div class="tip">Die Wirkungsgrade werden erst wichtig, wenn wir die tatsächlich bereitgestellte Nutzwärme vergleichen. Für den bisherigen reinen Heizwertvergleich bleibt die vereinfachte Rechnung mit 5 t gültig.</div>'],
["3. Pellet-Formel finden",'<p>Bei Pellets ist die Brennstoffmenge eine <strong>Masse</strong>.</p><div class="formula">Q<sub>Pellets</sub> = m<sub>Pellets</sub> × H<sub>u,Pellets</sub></div><p>Wir kennen die Energie und den Heizwert. Gesucht ist die Masse <strong>m</strong>.</p>'],
["4. Formel nach m umstellen",'<p>Beide Seiten durch den Heizwert teilen:</p><div class="formula">m<sub>Pellets</sub> = Q<sub>Pellets</sub> / H<sub>u,Pellets</sub></div><p>Einheitenprüfung: kWh / (kWh/kg) = kg.</p>'],
["5. Einsetzen und rechnen",'<div class="formula">m<sub>Pellets</sub> = 25.000 kWh / (5 kWh/kg)<br>= 5.000 kg</div><p>Von kg in t umrechnen: <strong>1 t = 1.000 kg</strong>.</p><div class="formula">5.000 kg = 5 t</div>'],
["6. Antwort an den Kunden",'<p>„Für ungefähr die gleiche <strong>Brennstoffenergie</strong> wie 2.500 Liter Heizöl benötigen Sie bei diesen angenommenen Heizwerten <strong>5.000 kg, also etwa 5 Tonnen Holzpellets</strong>.“</p><div class="tip">Praxis-Hinweis: Die tatsächlichen Heizwerte schwanken; die Anlagenwirkungsgrade können verschieden sein. Für eine genaue Heizungsplanung muss man das berücksichtigen.</div>'],
["Jetzt bist du dran!",'<p>Ein anderer Kunde benötigt <strong>1.000 Liter Heizöl</strong>. Wie viele kg Pellets wären das bei denselben Heizwerten?</p><p>Schreibe erst die Formel auf und rechne selbst.</p><button type="button" class="answerbtn" id="reveal">Musterlösung aufdecken</button><div class="answer" id="answer"><div class="formula">Q = 1.000 × 10 = 10.000 kWh<br>m = 10.000 / 5 = 2.000 kg = 2 t</div><p><strong>Merksatz:</strong> Erst die Energie bestimmen, dann die Pelletmasse berechnen.</p></div>']
];let n=0;const stage=document.getElementById('stage'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),dots=document.getElementById('dots');function draw(){stage.innerHTML='<span class="pill">Folie '+(n+1)+'</span><h2>'+slides[n][0]+'</h2>'+slides[n][1];prev.disabled=n===0;next.textContent=n===slides.length-1?'Von vorn ↻':'Weiter →';counter.textContent=(n+1)+' / '+slides.length;dots.innerHTML=slides.map((_,i)=>'<button type="button" aria-label="Folie '+(i+1)+'" '+(i===n?'aria-current="step"':'')+'></button>').join('');dots.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{n=i;draw()});const b=document.getElementById('reveal');if(b)b.onclick=()=>{document.getElementById('answer').classList.add('open');b.hidden=true}}prev.onclick=()=>{if(n>0){n--;draw()}};next.onclick=()=>{n=n===slides.length-1?0:n+1;draw()};draw();
</script><script defer src="../shk-navigation.js"></script></body></html>
